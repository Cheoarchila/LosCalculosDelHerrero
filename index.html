<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los Cálculos del Herrero</title>

<link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<header>

    <h1>LCH</h1>
    <p>Los Cálculos del Herrero</p>

</header>

<main>

<!-- ====================================== -->
<!-- MENÚ PRINCIPAL -->
<!-- ====================================== -->

<section id="pantallaInicio">

    <div class="tarjeta" onclick="abrirAcanalado()">

        <div class="icono">📏</div>

        <div>

            <h2>Acanalado</h2>

            <p>90° - 45° - Machimbrado</p>

        </div>

    </div>

    <div class="tarjeta">

        <div class="icono">🏠</div>

        <div>

            <h2>Techos</h2>

            <p>Próximamente</p>

        </div>

    </div>

    <div class="tarjeta">

        <div class="icono">🚪</div>

        <div>

            <h2>Puertas</h2>

            <p>Próximamente</p>

        </div>

    </div>

</section>

<!-- ====================================== -->
<!-- ACANALADO -->
<!-- ====================================== -->

<section id="pantallaAcanalado" class="oculto">

<button class="volver" onclick="volverInicio()">

← Volver

</button>

<h2>Acanalado</h2>

<div class="tarjeta" onclick="abrir90()">

<div class="icono">📐</div>

<div>

<h2>90°</h2>

<p>Acanalado 90°</p>

</div>

</div>

<div class="tarjeta">

<div class="icono">📏</div>

<div>

<h2>45°</h2>

<p>Próximamente</p>

</div>

</div>

<div class="tarjeta">

<div class="icono">🔩</div>

<div>

<h2>Machimbrado</h2>

<p>Próximamente</p>

</div>

</div>

</section>

<!-- ====================================== -->
<!-- ACANALADO 90 -->
<!-- ====================================== -->

<section id="pantalla90" class="oculto">

<button class="volver" onclick="volverAcanalado()">

← Volver

</button>

<h2>Acanalado 90°</h2>

<label>Ancho final (mm)</label>
<input id="medidaFinal" type="number">

<label>Divisiones</label>
<input id="divisiones" type="number">

<label>Profundidad (mm)</label>
<input id="profundidad" type="number">

<label>Bordes (mm)</label>
<input id="bordes" type="number">

<label>Espesor (mm)</label>
<input id="espesor" type="number" step="0.1">

<button onclick="calcular90()">

CALCULAR

</button>

<button onclick="limpiar90()">

LIMPIAR

</button>

<hr>

<h3>Resultados</h3>

<p>Ancho de canal:
<strong id="anchoCanal">-</strong>
</p>

<p>Alto de canal:
<strong id="altoCanal">-</strong>
</p>

<p>Desarrollo:
<strong id="desarrollo">-</strong>
</p>

</section>

</main>

<script src="js/script.js"></script>

</body>

</html>
