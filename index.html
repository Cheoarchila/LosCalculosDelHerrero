<main id="contenido">

    <!-- MENÚ PRINCIPAL -->

    <div id="inicio">

        <div class="tarjeta" onclick="abrirAcanalado()">
            <div class="icono">📏</div>
            <div>
                <h2>Acanalado</h2>
                <p>90°, 45° y Machimbrado</p>
            </div>
        </div>

        <div class="tarjeta">
            <div class="icono">📐</div>
            <div>
                <h2>Techos</h2>
                <p>Próximamente</p>
            </div>
        </div>

        <div class="tarjeta">
            <div class="icono">🚪</div>
            <div>
                <h2>Puertas</h2>
                <p>Próximamente</p>
            </div>
        </div>

    </div>

    <!-- SUBMENÚ ACANALADO -->

    <div id="acanalado" style="display:none;">

        <button class="volver" onclick="volverInicio()">
            ← Volver
        </button>

        <h2>Acanalado</h2>

        <div class="tarjeta">
            <div class="icono">📐</div>
            <div>
                <h2>90°</h2>
                <p>Próximamente</p>
            </div>
        </div>

        <div class="tarjeta">
            <div class="icono">📏</div>
            <div>
                <h2>45°</h2>
                <p>Próximamente</p>
            </div>
        </div>

        <div class="tarjeta">
            <div class="icono">🔩</div>
            <div>
                <h2>Machimbrado</h2>
                <p>Próximamente</p>
            </div>
        </div>

    </div>

</main>
