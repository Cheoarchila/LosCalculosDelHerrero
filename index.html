<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los Cálculos del Herrero</title>

<link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<header>

    <h1>LCH</h1>
    <p>Los Cálculos del Herrero</p>

</header>

<main>

<!-- ====================================== -->
<!-- MENÚ PRINCIPAL -->
<!-- ====================================== -->

<section id="pantallaInicio">

    <div class="tarjeta" onclick="abrirAcanalado()">

        <div class="icono">📏</div>

        <div>

            <h2>Acanalado</h2>

            <p>90° - 45° - Machimbrado</p>

        </div>

    </div>

    <div class="tarjeta">

        <div class="icono">🏠</div>

        <div>

            <h2>Techos</h2>

            <p>Próximamente</p>

        </div>

    </div>

    <div class="tarjeta">

        <div class="icono">🚪</div>

        <div>

            <h2>Puertas</h2>

            <p>Próximamente</p>

        </div>

    </div>

</section>

<!-- ====================================== -->
<!-- ACANALADO -->
<!-- ====================================== -->

<section id="pantallaAcanalado" class="oculto">

<button class="volver" onclick="volverInicio()">

← Volver

</button>

<h2>Acanalado</h2>

<div class="tarjeta" onclick="abrir90()">

<div class="icono">📐</div>

<div>

<h2>90°</h2>

<p>Acanalado 90°</p>

</div>

</div>

<div class="tarjeta">

<div class="icono">📏</div>

<div>

<h2>45°</h2>

<p>Próximamente</p>

</div>

</div>

<div class="tarjeta">

<div class="icono">🔩</div>

<div>

<h2>Machimbrado</h2>

<p>Próximamente</p>

</div>

</div>

</section>

<!-- ====================================== -->
<!-- ACANALADO 90 -->
<!-- ====================================== -->

<section id="pantalla90" class="oculto">

<button class="volver" onclick="volverAcanalado()">
← Volver
</button>

<div class="fila">
<label>Ancho de Plancha</label>

<div style="display:flex;gap:8px;align-items:center;width:100%;">

<input
id="anchoPlancha"
type="number"
value="1200"
readonly
style="flex:1;">

<button
type="button"
id="editarPlancha"
onclick="editarPlancha()"
style="width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;vertical-align:middle;">
✏️
</button>


</button>
</div>

</div>

    
<div class="fila">
<label>Medida Interna</label>
<input id="medidaFinal" type="number" value="1500">
</div>

<div class="fila">
<label>Canales</label>
<input id="divisiones" type="number" value="3">
</div>

<div class="fila" id="filaProfundidad">
<label>Profundidad</label>
<input id="profundidad" type="number" value="15">
</div>

<div class="fila oculto" id="mensajeProfundidad">
<label>Profundidad</label>
<span>No aplica para 1 canal</span>
</div>
<div class="fila">
<label>Bordes</label>
<input id="bordes" type="number" value="20">
</div>

<div class="fila">
<label>Espesor</label>
<input id="espesor" type="number" value="1" step="0.1">
</div>

<hr>

<div class="resultado">
<span>Desarrollo</span>
<strong id="desarrollo">0</strong>
</div>

<div class="resultado">
<span>Ancho Canal</span>
<strong id="anchoCanal">0</strong>
</div>

<hr>
<h3>Marcas de Doblado</h3>

<div id="marcas"></div>

</section>

</main>

<script src="js/script.js"></script>

</body>

</html>
